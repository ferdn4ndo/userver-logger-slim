version: '3'
services:
  api:
    container_name: userver-logger-api
    image: ferdn4ndo/userver-logger-api:1.0.1
    volumes:
      - ./log_files:/log_files
    env_file:
      - ./backend/.env

  container_monitor:
    container_name: userver-container-monitor
    build:
      context: ./container_monitor
      dockerfile: Dockerfile
    volumes:
      - ./container_monitor/data:/opt/monitor/data
      - ./container_monitor/scripts:/opt/monitor/scripts
      - ./log_files:/opt/monitor/logs
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - ./container_monitor/.env

networks:
  default:
    external:
      name: nginx-proxy
